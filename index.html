<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#151F44" />
    <title>Postcard Trail</title>
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/app.css" />
    <link rel="stylesheet" href="/src/styles/title.css" />
    <link rel="stylesheet" href="/src/styles/settings.css" />
    <link rel="stylesheet" href="/src/styles/play.css" />
    <script>
      // Runs before the entry module: when the entry module or one of its imports fails to load, the error state with
      // "Try again" appears. Portal SDKs are classic scripts (src/platform/script.ts); one an ad blocker stops does not
      // count, the game runs without it. Matched by type because the build drops other attributes of the entry tag.
      addEventListener(
        'error',
        (event) => {
          if (event.target instanceof Element && event.target.matches('script[type="module"]')) {
            document.getElementById('boot')?.setAttribute('data-state', 'error')
          }
        },
        true,
      )
      addEventListener('click', (event) => {
        if (event.target instanceof Element && event.target.closest('#boot-retry')) location.reload()
      })
    </script>
  </head>
  <body>
    <div id="app">
      <div id="boot" class="boot" data-state="loading">
        <h1 class="logo">
          <svg class="logo-arc" viewBox="0 0 240 60" aria-hidden="true"><path d="M12 56 Q120 -22 228 56" /></svg>
          <span class="logo-line">Postcard</span> <span class="logo-line">Trail</span>
        </h1>
        <p class="boot-status" role="status"><span class="boot-bar" aria-hidden="true"></span>Loading…</p>
        <div class="boot-error" role="alert">
          <p>The game could not load. Check your connection and try again.</p>
          <button id="boot-retry" class="primary" type="button">Try again</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
